function classify(u,ms){
 if(u.status_manual)return u.status_manual;
 const um=ms.filter(m=>m.unit_id===u.id);
 const lastOut=[...um].reverse().find(m=>m.kind==="out");
 const openOut=lastOut&&!um.some(m=>m.kind==="in"&&new Date(m.at)>=new Date(lastOut.at));
 if(openOut)return new Date(lastOut.due_at)<new Date()?"overdue":"out";
 const lastService=um.filter(m=>m.kind==="service").pop();
 const base=lastService?new Date(lastService.at):new Date(u.purchase_date||u.created_at||Date.now());
 if(Date.now()-base>14*864e5)return"service";
 return"free";
}

const lastMh=(u,ms)=>{const m=ms.filter(x=>x.unit_id===u.id&&x.engine_hours!=null).pop();return m?m.engine_hours:null};

 return (t.in&&t.out&&t.out.mileage!=null&&t.in.mileage!=null)?((t.in.mileage-t.out.mileage)+" км"):"в рейсе";
};
const statLine=(u,ms)=>{
 const all=trips(u,ms);
 const valKm=t=>(t.in&&t.out&&t.out.mileage!=null&&t.in.mileage!=null)?(t.in.mileage-t.out.mileage):0;
 const valMh=t=>(t.in&&t.out&&t.out.engine_hours!=null&&t.in.engine_hours!=null)?(t.in.engine_hours-t.out.engine_hours):0;
 const wk=all.filter(t=>t.out.at&&new Date(t.out.at)>=new Date(Date.now()-7*864e5));
 const mo=all.filter(t=>t.out.at&&new Date(t.out.at)>=new Date(Date.now()-30*864e5));
 const km=u.track_km!==false?`${Math.round(wk.reduce((s,t)=>s+valKm(t),0))} км`:null;
 const mh=u.track_mh!==false?`${Math.round(wk.reduce((s,t)=>s+valMh(t),0)*10)/10} мч`:null;

 return `за неделю: ${[km,mh].filter(Boolean).join(" · ")} · за месяц: ${[kmM,mhM].filter(Boolean).join(" · ")}`;
};

function trips(u,ms){
 const um=ms.filter(m=>m.unit_id===u.id).sort((a,b)=>new Date(a.at)-new Date(b.at));

function toLineHtml(u,ms){
 const mh=lastMh(u,ms);
 if(u.service_interval_mh!=null&&u.service_base_mh!=null&&mh!=null){
  const rem=u.service_base_mh+u.service_interval_mh-mh;
  if(rem<=0)return` · <span style="color:var(--bad)">ТО просрочено</span>`;
  if(rem<=15)return` · <span style="color:var(--warn)">скоро ТО · ${Math.round(rem)} мч</span>`;
  return"";
 }
 if(u.service_interval_km&&u.service_base_km!=null&&lastMileage(u,ms)!=null){
  const rem=u.service_base_km+u.service_interval_km-lastMileage(u,ms);
  if(rem<=0)return` · <span style="color:var(--bad)">ТО просрочено</span>`;
  if(rem<=100)return` · <span style="color:var(--warn)">скоро ТО · ${Math.round(rem)} км</span>`;
 }
 return"";
}

  ${S.dmg===true?`<label>Что повреждено</label><input id="note" placeholder="Опишите повреждение" oninput="S.note=this.value" value="${esc(S.note||"")}">`:""}

function toBlock(u,ms){
 const mh=lastMh(u,ms);
 const km=lastMileage(u,ms);
 let rem=null,unit=null;
 if(u.service_interval_mh!=null&&u.service_base_mh!=null&&mh!=null){rem=u.service_base_mh+u.service_interval_mh-mh;unit="мч";}
 else if(u.service_interval_km&&u.service_base_km!=null&&km!=null){rem=u.service_base_km+u.service_interval_km-km;unit="км";}
 const hasInt=u.service_interval_mh!=null||u.service_interval_km;
 let body;
 if(!hasInt)body=`<div class="plate yel">⚠ интервал ТО не задан</div>`;
 else if(rem==null)body=`<div class="mut">нужна отметка, чтобы считать ТО</div>`;
 else if(rem<=0)body=`<div class="dmg"><span>ТО просрочено на ${Math.round(-rem)} ${unit}</span></div>`;
 else if(rem<=(unit==="мч"?15:100))body=`<span class="warnplate">скоро ТО · осталось ${Math.round(rem)} ${unit}</span>`;
 else body=`<div class="mut">следующее ТО через ${Math.round(rem)} ${unit}</div>`;
 const intTxt=u.service_interval_mh!=null?`${u.service_interval_mh} мч`:(u.service_interval_km?`${u.service_interval_km} км`:null);
 const nextTxt=rem!=null&&unit?`следующее ТО через ${Math.round(rem)} ${unit}`:null;
 const summary=intTxt?`<div class="mut" style="margin-top:4px">Ваш текущий интервал ТО: <b>${intTxt}</b>${nextTxt?" · "+nextTxt:""}</div>`:"";
 if(!isOwner())return body+summary;
 if(!hasInt||S.toMenu===u.id){
  const mode=S.toMode||"mh";
  return `${body}${summary}
  <label>Отсчёт по</label><div class="chips">
   <button type="button" class="chip ${mode==="mh"?"on":""}" data-tomode="mh">Моточасам</button>
   <button type="button" class="chip ${mode==="km"?"on":""}" data-tomode="km">Пробегу</button>
  </div>
  <label>${mode==="mh"?"Интервал ТО, м/ч":"Интервал ТО, км"}</label><input id="to_interval" type="number" placeholder="${mode==="mh"?"100":"500"}">
  <button class="btn ghost sm" data-toset="${u.id}">Задать для этой единицы</button>
  <button class="btn ghost sm" data-tosetall="1" style="margin-top:6px">Задать для всего гаража</button>`;
 }
 return `${body}${summary}
 <div class="mrow" style="margin-top:6px">
  <button class="btn ghost sm" data-todone="${u.id}">ТО сделано</button>
  <button class="btn ghost sm" data-tomenu="${u.id}">⋮ Изменить интервал</button>
 </div>`;
}

function tripNewHTML(){
 const{units,marks,open_trips}=S.snap;
 const busy=new Set((open_trips||[]).flatMap(t=>t.units.map(x=>x.unit_id)));
 const free=units.filter(u=>{const st=classify(u,marks);return st!=="out"&&st!=="overdue"&&!busy.has(u.id);});
 const hs=[1,2,3,4,5];
 const hours=S.tn&&S.tn.hours||2;
 const sel=S.tn&&S.tn.sel||[];
 const done=S.tn&&S.tn.done||{};
 const openU=S.tn&&S.tn.open;
 const ready=sel.filter(id=>done[id]);
 const head=`<button class="btn ghost" data-nav="dash" style="margin-bottom:12px">← назад</button>
 <h1 style="margin-bottom:8px">Новый маршрут</h1>
 <div class="card"><label>Длительность маршрута</label><div class="chips">${hs.map(h=>`<button type="button" class="chip ${hours===h?"on":""}" data-th="${h}">${h} ч</button>`).join("")}<button type="button" class="chip ${typeof hours!=="number"?"on":""}" data-th="x">своё</button></div>
 ${typeof hours!=="number"?`<input id="thours" type="number" placeholder="Часы" value="${S.tn.hVal||""}" oninput="S.tn.hVal=this.value">`:""}
 </div>`;
 const foot=`<button class="btn green" data-togo="1" ${ready.length?"":"disabled"}>ВЫЕЗД (${ready.length})</button>
 <button class="btn ghost sm" data-nav="dash" style="margin-top:6px">Отмена</button>`;
 if(openU){
  const u=units.find(x=>x.id===openU);
  if(u){
   const lastKm=lastMileage(u,marks),lastH=lastMh(u,marks);
   return head+`<div class="card">
    <b class="sect">Машина</b>
    <button type="button" class="chip y" data-upick="${u.id}" style="display:inline-block;margin-top:6px">№${esc(u.board)} · ${esc(u.model)}</button>
    <div class="plate red">⚠ Не забудь сверить пробег и моточасы</div>
    ${u.track_km!==false?`<label>Пробег, км</label><input type="number" value="${S.tn.km[u.id]??(lastKm??"")}" oninput="S.tn.km[${u.id}]=this.value">`:""}
    ${u.track_mh!==false?`<label>Моточасы</label><input type="number" value="${S.tn.mh[u.id]??(lastH??"")}" oninput="S.tn.mh[${u.id}]=this.value">`:""}
    <button class="btn ghost sm" data-tdone="${u.id}" style="margin-top:8px">Готово</button>
   </div>`+foot;
  }
 }
 const chips=free.map(u=>{
  const isDone=done[u.id], isSel=sel.includes(u.id);
  const cls=isDone?"g":(isSel?"y":"");
  return `<button type="button" class="chip ${cls}" data-upick="${u.id}" style="display:inline-block;margin:4px 4px 0 0">${isDone?"✓ ":""}№${esc(u.board)} · ${esc(u.model)}</button>`;
 }).join("")||`<div class="mut">свободных машин нет</div>`;
 return head+`<div class="card"><b class="sect">Выбери машины по очереди (${ready.length})</b><div style="margin-top:6px">${chips}</div></div>`+foot;
}

function nextBoard(units){
 const used=new Set();
 for(const u of units){const n=parseInt(String(u.board).replace(/\D/g,""),10);if(!Number.isNaN(n)&&n>0)used.add(n);}
 let n=1;while(used.has(n))n++;
 return String(n).padStart(3,"0");
}

function loadDopen(){
 try{return JSON.parse(localStorage.getItem("ga_dopen_"+S.snap.garage_id)||"{}");}catch(e){return{};}
}
function saveDopen(){
 try{localStorage.setItem("ga_dopen_"+S.snap.garage_id,JSON.stringify(S.dopen));}catch(e){}
}

function render(){
 const a=document.getElementById("app");
 if(!S.snap){a.innerHTML=`<div class="card" style="text-align:center">загрузка...</div>`;return;}
 S.dopen=Object.assign(S.dopen,loadDopen());
 const openMap={};document.querySelectorAll("details[data-pers]").forEach(d=>{openMap[d.dataset.pers]=d.open});
 const U=id=>S.snap.units.find(x=>x.id===id);
 const uOp=S.editOpen?U(S.editOpen):null;
 const uHist=S.histUnit?U(S.histUnit):null;
 const uParts=S.partsUnit?U(S.partsUnit):null;
 a.innerHTML=
  S.view==="edit"?editHTML():
  S.view==="garages"?garagesHTML():
  S.view==="trip_new"?tripNewHTML():
  S.view==="trip_close"?tripCloseHTML():
  S.view==="history"&&uHist?histHTML(uHist):
  S.view==="parts"&&uParts?partsHTML(uParts):
  (uOp?unitDetail(uOp):dashHTML());
 document.querySelectorAll("details[data-pers]").forEach(d=>{if(d.dataset.pers in openMap)d.open=openMap[d.dataset.pers];});
}

   S.snap=await api("snapshot");S.partForm=null;toast("Запчасть сохранена");render();
  }
  else if(b.dataset.pdellast!==undefined){
   await api("part_del_last",{unit_id:Number(b.dataset.pdellast)});
   S.snap=await api("snapshot");toast("Последняя запчасть удалена");render();
  }
  else if(b.dataset.pclear!==undefined){
   if(!confirm("Очистить все запчасти этой единицы?"))return;
   await api("part_clear",{unit_id:Number(b.dataset.pclear)});
   S.snap=await api("snapshot");toast("Запчасти очищены");render();
  }
  else if(b.dataset.hdellast!==undefined){
   await api("trip_del_last",{unit_id:Number(b.dataset.hdellast)});
   S.snap=await api("snapshot");toast("Последний выезд удалён");render();
  }
  else if(b.dataset.hclear!==undefined){
   if(!confirm("Удалить историю поездок? (последний пробег сохранится)"))return;
   await api("hist_clear",{unit_id:Number(b.dataset.hclear)});
   S.snap=await api("snapshot");toast("История очищена");render();
  }
  else if(b.dataset.back){S.editOpen=null;S.dmg=null;S.km=null;S.mh=null;S.note=null;S.tripOpen=null;S.showReturn=null;render();}
  else if(b.dataset.trip){S.tripOpen=S.editOpen;S.showReturn=null;S.km=null;S.mh=null;render();}
  else if(b.dataset.tripc){S.tripOpen=null;render();}
  else if(b.dataset.dmg){S.dmg=b.dataset.dmg==="yes";render();}
  else if(b.dataset.dclose!==undefined){
   await api("damage_close",{unit_id:Number(b.dataset.dclose)});
   S.snap=await api("snapshot");toast("Повреждение убрано");render();
  }
  else if(b.dataset.ddismiss!==undefined){
   await api("damage_dismiss",{unit_id:Number(b.dataset.ddismiss)});
   S.snap=await api("snapshot");toast("Предупреждение скрыто");render();
  }
  else if(b.dataset.out){
   const hours=S.hoursSel==="x"?(Number(S.hoursVal)||2):(Number(S.hoursSel)||2);
   await api("mark",{unit_id:S.editOpen,type:"out",hours,mileage:Number(g("mileage"))||null,engine_hours:g("mh")?Number(g("mh")):null,fuel:0});
   S.snap=await api("snapshot");S.km=null;S.mh=null;S.tripOpen=null;toast("Принято: выезд зафиксирован");render();
  }
  else if(b.dataset.in){
   await api("mark",{unit_id:S.editOpen,type:"in",fuel:0,mileage:Number(g("mileage"))||null,engine_hours:g("mhin")?Number(g("mhin")):null,damage:S.dmg===true?"yes":"no",note:S.dmg===true?(S.note||g("note")):null});
   S.snap=await api("snapshot");S.km=null;S.mh=null;S.dmg=null;S.note=null;S.showReturn=null;toast("Принято: возврат зафиксирован");render();
  }
 }catch(e){toast("Ошибка: "+e.message);}
 finally{BUSY=false;}
});

document.addEventListener("change",async ev=>{
 if(ev.target.id!=="e_file")return;
 const f=ev.target.files[0];if(!f)return;
 if(f.size>5*1024*1024){toast("Файл больше 5 МБ");return;}
 try{
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(f);});
  S.ePhotoB64=b64;S.ePhotoType=f.type||"image/jpeg";
  render();
 }catch(e){toast("Ошибка: "+e.message);}
});

function gate(msg){
 return `<div class="card" style="text-align:center">
  <div style="margin-top:8px;font-weight:700">Открой приложение через кнопку меню бота</div>
  ${msg?`<div class="mut" style="margin-top:6px">${esc(msg)}</div>`:""}
  <button class="btn" onclick="boot()" style="margin-top:12px">Проверить снова</button>
 </div>`;
}
async function snapWithRetry(){
 let last;
 for(let i=0;i<3;i++){
  try{ return await api("snapshot"); }
  catch(e){
   last=e; const m=String(e.message||e);
   if(/unauthorized|HTTP 401|подписка истекла/i.test(m)) throw e;
   if(i<2) await new Promise(r=>setTimeout(r,800));
  }
 }
 throw last;
}
async function boot(){
 if(!tg.initData){
  document.getElementById("app").innerHTML=gate("");
  return;
 }
 let cached=null;try{cached=JSON.parse(localStorage.getItem("ga_snap")||"null");}catch(e){}
 if(cached&&cached.garage_id){S.snap=cached;try{render();}catch(e){S.snap=null;}}
 try{
  S.snap=await snapWithRetry();
  try{localStorage.setItem("ga_snap",JSON.stringify(S.snap));}catch(e){}
  render();
 }catch(e){
  const m=String(e.message||e);
  if(/unauthorized|HTTP 401/i.test(m)){
   if(S.snap)toast("Ошибка: "+m);
   else document.getElementById("app").innerHTML=gate(m);
   return;
  }
  if(S.snap)toast("Ошибка: "+m);
  else document.getElementById("app").innerHTML=`<div class="card">Ошибка: ${esc(m)}<br><span class="mut">Нет связи с сервером. Проверь интернет и открой заново</span></div>`;
 }
}
boot();
</script>
